<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Category Shop | Textile Market'">Shop Textiles</title>
    <meta name="description" content="Browse our entire collection. Use the navigation to find perfect textiles.">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <!-- Unified Navbar Component -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="/" aria-label="Home">
                <i class="fa-solid fa-layer-group"></i> Textile Market
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active fw-bold" href="/products"><i class="fa-solid fa-store"></i> Shop All</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center gap-3">
                    <div th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
                        <a class="btn btn-outline-danger btn-sm" href="/admin" aria-label="Admin Dashboard"><i class="fa-solid fa-shield-halved"></i> Admin</a>
                    </div>
                    <div th:if="${#authorization.expression('isAuthenticated()')}"><a class="btn btn-light position-relative" href="/cart" aria-label="Cart"><i class="fa-solid fa-cart-shopping"></i> Cart<span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" id="cartBadge" style="display:none;">0</span></a></div>
                    <div th:if="${#authorization.expression('isAuthenticated()')}">
                        <form th:action="@{/logout}" method="post" class="m-0">
                            <button type="submit" class="btn btn-outline-secondary btn-sm" aria-label="Logout"><i class="fa-solid fa-right-from-bracket"></i></button>
                        </form>
                    </div>
                    <div th:unless="${#authorization.expression('isAuthenticated()')}">
                        <a class="btn btn-outline-primary btn-sm" href="/login"><i class="fa-solid fa-right-to-bracket"></i> Login</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold"><i class="fa-solid fa-boxes-stacked text-primary"></i> Product Catalog</h2>
            <a href="/" class="btn btn-outline-secondary btn-sm"><i class="fa-solid fa-arrow-left"></i> Back to Hubs</a>
        </div>

        <div class="grid-cols-tx">
            <div th:each="product : ${products}" class="card card-tx">
                <img th:src="${#strings.isEmpty(product.getImageUrl()) ? '/images/placeholder.jpg' : product.getImageUrl()}" class="img-tx-product" alt="Product Thumbnail">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title fw-bold text-truncate" th:text="${product.name}"></h5>
                    <p class="text-muted small mb-3"><i class="fa-solid fa-layer-group"></i> Sets available: <span th:text="${product.setsAvailable}"></span></p>
                    <div class="d-flex justify-content-between align-items-center mt-auto">
                        <span class="h5 mb-0 text-success fw-bold" th:text="${'$' + product.price}"></span>
                        <a th:href="@{/product(id=${product.id})}" class="btn btn-primary-tx btn-sm px-3" aria-label="View Details">Details <i class="fa-solid fa-arrow-right"></i></a>
                    </div>
                </div>
            </div>
            <div th:if="${#lists.isEmpty(products)}" class="col-12 py-5 text-center text-muted">
                <i class="fa-solid fa-ghost fa-4x mb-3 text-secondary"></i>
                <h4>No Products Found</h4>
                <p>Try exploring another Hub.</p>
                <a href="/" class="btn btn-primary-tx mt-2"><i class="fa-solid fa-home"></i> Return Home</a>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function loadCartBadge() {
            try {
                const res = await fetch('/api/cart/count');
                if (res.ok) {
                    const data = await res.json();
                    const badge = document.getElementById('cartBadge');
                    if (badge && data.count > 0) {
                        badge.textContent = data.count;
                        badge.style.display = '';
                    }
                }
            } catch(e) {}
        }
        document.addEventListener('DOMContentLoaded', loadCartBadge);
    </script>
</body>
</html>
