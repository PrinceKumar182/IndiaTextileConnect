<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Textiles | Textile Market</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

    <!-- Unified Navbar Component -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
        <div class="container d-flex align-items-center">
            <a class="navbar-brand fw-bold text-primary me-auto" href="/" aria-label="Textile Market Home">
                <i class="fa-solid fa-layer-group"></i> Textile Market
            </a>

            <!-- Mobile Persistent Icons -->
            <div class="d-flex align-items-center gap-3 order-lg-2 me-3 me-lg-0">
                <a class="text-dark text-decoration-none d-lg-none" href="/products" aria-label="Shop All">
                    <i class="fa-solid fa-store fs-4"></i>
                </a>
                <div th:if="${#authorization.expression('isAuthenticated()')}" class="d-lg-none">
                    <a class="text-dark text-decoration-none position-relative" href="/cart" aria-label="View Cart">
                        <i class="fa-solid fa-cart-shopping fs-4"></i>
                        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" id="cartBadgeMobile" style="display:none;">0</span>
                    </a>
                </div>
            </div>

            <!-- Toggler -->
            <button class="navbar-toggler order-lg-3" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse order-lg-1" id="mainNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item d-none d-lg-block">
                        <a class="nav-link active fw-bold" href="/products"><i class="fa-solid fa-store"></i> Shop All</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center gap-3">
                    <div th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
                        <a class="btn btn-outline-danger btn-sm" href="/admin"><i class="fa-solid fa-shield-halved"></i> Admin</a>
                    </div>
                    <div th:if="${#authorization.expression('isAuthenticated()')}" class="d-none d-lg-block">
                        <a class="btn btn-light position-relative" href="/cart">
                            <i class="fa-solid fa-cart-shopping"></i> Cart
                            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" id="cartBadge" style="display:none;">0</span>
                        </a>
                    </div>
                    <div th:if="${#authorization.expression('isAuthenticated()')}">
                        <form th:action="@{/logout}" method="post" class="m-0">
                            <button type="submit" class="btn btn-outline-secondary btn-sm"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
                        </form>
                    </div>
                    <div th:unless="${#authorization.expression('isAuthenticated()')}">
                        <a class="btn btn-outline-primary btn-sm" href="/login"><i class="fa-solid fa-right-to-bracket"></i> Login</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        
        <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-2">
            <h2 class="fw-bold mb-0"><i class="fa-solid fa-boxes-stacked text-primary"></i> Product Catalog</h2>
            <a href="/" class="btn btn-outline-secondary btn-sm"><i class="fa-solid fa-arrow-left"></i> Home</a>
        </div>

        <div class="row">
            <!-- Filter Sidebar -->
            <div class="col-lg-3 mb-4">
                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <h5 class="fw-bold mb-3"><i class="fa-solid fa-filter text-muted"></i> Filters</h5>
                        
                        <form method="get" th:action="@{/products}">
                            
                            <!-- Search (Carry Over) -->
                            <input type="hidden" name="searchQuery" th:if="${searchQuery != null}" th:value="${searchQuery}">

                            <div class="mb-3">
                                <label class="form-label small fw-bold text-muted">Hub (Location)</label>
                                <select name="placeId" class="form-select form-select-sm">
                                    <option value="">All Hubs</option>
                                    <option th:each="p : ${places}" 
                                            th:value="${p.id}" 
                                            th:text="${p.name}"
                                            th:selected="${param.placeId != null and param.placeId[0] == p.id}">
                                    </option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label small fw-bold text-muted">Category</label>
                                <select name="categoryId" class="form-select form-select-sm">
                                    <option value="">All Categories</option>
                                    <option th:each="c : ${categories}" 
                                            th:value="${c.id}" 
                                            th:text="${c.name}"
                                            th:selected="${param.categoryId != null and param.categoryId[0] == c.id}">
                                    </option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label small fw-bold text-muted">Sort By</label>
                                <select name="sortBy" class="form-select form-select-sm">
                                    <option value="createdAt" th:selected="${param.sortBy == null or param.sortBy[0] == 'createdAt'}">Newest First</option>
                                    <option value="price" th:selected="${param.sortBy != null and param.sortBy[0] == 'price'}">Price</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label small fw-bold text-muted">Order</label>
                                <select name="order" class="form-select form-select-sm">
                                    <option value="desc" th:selected="${param.order == null or param.order[0] == 'desc'}">High to Low / Newest</option>
                                    <option value="asc" th:selected="${param.order != null and param.order[0] == 'asc'}">Low to High / Oldest</option>
                                </select>
                            </div>

                            <button type="submit" class="btn btn-primary-tx w-100 py-2 fw-bold">Apply Filters</button>
                            <a href="/products" class="btn btn-outline-secondary w-100 py-1 mt-2 small">Reset</a>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Product Grid -->
            <div class="col-lg-9">
                <div class="grid-cols-tx">
                    <div th:each="product : ${products}" class="card card-tx">
                        <img th:src="${#strings.isEmpty(product.getImageUrl()) ? '/images/placeholder.jpg' : product.getImageUrl()}" class="img-tx-product" alt="Product Thumbnail">
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title fw-bold text-truncate" th:text="${product.name}"></h5>
                            <p class="text-muted small mb-3"><i class="fa-solid fa-layer-group"></i> Sets available: <span th:text="${product.setsAvailable}"></span></p>
                            <div class="d-flex justify-content-between align-items-center mt-auto">
                                <span class="h5 mb-0 text-success fw-bold" th:text="${'₹' + product.price}"></span>
                                <a th:href="@{/product(id=${product.id})}" class="btn btn-primary-tx btn-sm px-3">Details <i class="fa-solid fa-arrow-right"></i></a>
                            </div>
                        </div>
                    </div>
                    
                    <div th:if="${#lists.isEmpty(products)}" class="col-12 py-5 text-center text-muted w-100" style="grid-column: 1 / -1;">
                        <i class="fa-solid fa-ghost fa-4x mb-3 text-secondary"></i>
                        <h4>No Products Found</h4>
                        <p>Try adjusting your search filters.</p>
                    </div>
                </div>

                <!-- Pagination -->
                <nav th:if="${productPage != null && productPage.totalPages > 1}" class="mt-5">
                    <ul class="pagination justify-content-center">
                        <li class="page-item" th:classappend="${productPage.first} ? 'disabled'">
                            <a class="page-link" th:href="@{/products(page=${productPage.number - 1}, size=${productPage.size}, placeId=${param.placeId}, categoryId=${param.categoryId}, sortBy=${param.sortBy}, order=${param.order})}">Previous</a>
                        </li>
                        <li class="page-item disabled d-none d-md-block">
                            <span class="page-link" th:text="'Page ' + (${productPage.number} + 1) + ' of ' + ${productPage.totalPages}"></span>
                        </li>
                        <li class="page-item" th:classappend="${productPage.last} ? 'disabled'">
                            <a class="page-link" th:href="@{/products(page=${productPage.number + 1}, size=${productPage.size}, placeId=${param.placeId}, categoryId=${param.categoryId}, sortBy=${param.sortBy}, order=${param.order})}">Next</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function loadCartBadge() {
            try {
                const res = await fetch('/api/cart/count');
                if (res.ok) {
                    const data = await res.json();
                    
                    const badge = document.getElementById('cartBadge');
                    if (badge && data.count > 0) {
                        badge.textContent = data.count;
                        badge.style.display = '';
                    }
                    
                    const badgeMobile = document.getElementById('cartBadgeMobile');
                    if (badgeMobile && data.count > 0) {
                        badgeMobile.textContent = data.count;
                        badgeMobile.style.display = '';
                    }
                }
            } catch(e) {}
        }
        document.addEventListener('DOMContentLoaded', loadCartBadge);
    </script>
</body>
</html>
